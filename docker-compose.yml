# =============================================================================
# toon-finance — the whole deployment, on any Linux box with Docker.
#
#   docker compose pull && docker compose up -d
#
# Configuration lives in a `.env` NEXT TO THIS FILE (copy docker/env.example).
# For the default setup — a small VPS with a domain — only TOON_HOSTNAME,
# SESSION_SECRET and the mail relay need a value.
#
# TWO SERVICES, AND NO API KEY REQUIRED BETWEEN THEM:
#   app      the API + the PWA, one origin, one port (see Dockerfile)
#   mailpit  a local SMTP sink + a web UI, used until a real relay is configured
#
# TLS TERMINATION IS NOT IN THIS FILE ANY MORE. It moved to the `toon-edge` stack
# (/opt/toon-edge), a single shared Caddy that owns ports 80/443 for every toon app
# on the host and routes by hostname. This stack used to ship its own Caddy, which
# works for exactly one app per machine: with toon-recipe already running, this
# stack's `docker compose up -d` died with "port is already allocated". Nothing
# about the app changed — it still serves its own `/` on its own hostname; only
# the proxy is shared.
#
# THIS STACK THEREFORE NEEDS THE SHARED NETWORK TO EXIST FIRST:
#
#     docker network create toon-edge     # once per machine
#
# and `TOON_TLS_ISSUER` / `TOON_HSTS_MAX_AGE` now live in /opt/toon-edge/.env,
# not here. See the toon-edge README for the full runbook.
#
# Mail is the one thing with a choice to make: out of the box `app` talks SMTP
# to `mailpit` over the private compose network, which COLLECTS mail and
# delivers nothing — fine for a first look, useless for an invite or a password
# reset to an actual inbox. Point MAIL_HOST/MAIL_USER/… at a real relay in the
# `.env` when you want delivery; the adapter is the same either way. The
# database is a local libSQL file, so there is no third-party account needed to
# run this at all.
# =============================================================================

name: toon-finance

services:
  app:
    image: ${TOON_IMAGE:-ghcr.io/toonvish/toon-finance:latest}
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DEFAULT_LOCALE: "de"

      # --- database (inside the one volume) ---------------------------------
      DATABASE_URL: "file:/app/data/local.db"

      # --- public identity ---------------------------------------------------
      # No cors() call in this API at all (single-origin, see CLAUDE.md decision
      # 7) — WEB_ORIGIN exists only as documentation of the public address.
      WEB_ORIGIN: "https://${TOON_HOSTNAME}"
      # EMPTY on purpose: the bundle then uses relative URLs and the API serves
      # it from the same origin. Do not set this to an absolute address.
      PUBLIC_API_URL: ""

      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is missing - see docker/env.example}

      # Caddy sits in front and OVERWRITES X-Forwarded-For (see docker/Caddyfile).
      # That overwrite is what makes trusting the header safe here; without it
      # every rate limit would be bypassable by sending your own header.
      TRUST_PROXY: "1"

      # --- mail ----------------------------------------------------------
      # The defaults are the Mailpit container next door: it needs no
      # credentials and nothing leaves the machine, so plaintext SMTP is
      # acceptable on that hop and ONLY there — which is why env.ts refuses to
      # combine MAIL_SECURITY=none with a user/password. For real delivery set
      # MAIL_HOST/MAIL_PORT/MAIL_SECURITY/MAIL_USER/MAIL_PASSWORD in the `.env`.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SECURITY: ${MAIL_SECURITY:-none}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Haushaltskasse <finanzen@localhost>}
    volumes:
      # The database. THIS is the volume to back up.
      - toon-data:/app/data
    # No published port: only Caddy may reach the app. Publishing 3001 as well
    # would offer the same site over plain http, where the PWA silently does
    # not work and the session cookie loses its Secure flag.
    expose:
      - "3001"
    networks:
      # `toon` is the PRIVATE network of this project and carries exactly one hop:
      # app -> mailpit. Mailpit is deliberately NOT on the shared edge network.
      toon:
      # `finance-app` IS LOAD-BEARING, not decoration. toon-recipe also calls its
      # service `app`, and compose registers the SERVICE NAME as an alias on every
      # network a container joins — so on the shared edge network two containers
      # would answer to `app` and Caddy would round-robin between the finance and
      # the recipe app. It fails silently: the page loads, every other request
      # comes from the wrong application. The alias is what the Caddyfile targets.
      edge:
        aliases:
          - finance-app
    # Bun, a libSQL file and the static PWA — a few hundred MB is plenty, and a
    # limit below the machine's RAM is what keeps a runaway request from taking
    # the Docker daemon with it.
    mem_limit: ${TOON_MEM_LIMIT:-512m}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mailpit:
    # Pinned for the same reason as Caddy.
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      # Keep the mailbox bounded; these are notifications, not an archive.
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # 127.0.0.1 ON PURPOSE — NOT a public or LAN port.
      #
      # This UI shows every mail the app sends, and those mails contain
      # PASSWORD RESET AND INVITE LINKS — a household of two, but anyone who
      # can open this UI can take over either account by requesting a reset.
      # Bound to the server's loopback interface it is reachable only over SSH:
      #
      #     ssh -N -L 8025:127.0.0.1:8025 <user>@<server>
      #     then open http://localhost:8025
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data
    networks:
      - toon
    logging: *logging

networks:
  # Private to this compose project: only app and mailpit are on it.
  toon:
    driver: bridge
  # EXTERNAL, and created by hand once (`docker network create toon-edge`). It is
  # shared with the toon-edge proxy and every other toon app on the host, so it
  # belongs to none of them: that way `docker compose down` here never tries to
  # tear down a network the other stacks are still using. ONLY `app` joins it —
  # mailpit stays off the shared network, so the other app cannot reach the UI
  # that shows every password-reset and invite link.
  edge:
    external: true
    name: toon-edge

volumes:
  # The database. THIS is the volume to back up. caddy-data/caddy-config are gone
  # from this stack; the certificates live in the toon-edge project now.
  toon-data:
  mailpit-data:
