# The four verification gates from CLAUDE.md, on every push and pull request.
# Nothing is published from here — see release.yml for the image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch makes the previous run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # ~/.bun/install/cache is what `bun install` actually reads; keying on the
      # lockfile means a dependency change is the only thing that pays full price.
      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # No DATABASE_URL is set on purpose: env.ts forces a fresh temp-file DB
      # (or TEST_DATABASE_URL, if a run wants to pin one) under NODE_ENV=test,
      # and a runner that could reach a real database would be a bug.
      - name: Test
        run: bun test

      - name: Build web app
        run: bun run build
        env:
          # Same as the Docker build: relative URLs, so the bundle is not tied to
          # a hostname. See the Dockerfile's web-build stage.
          PUBLIC_API_URL: ""

      # The PWA is the reason the deployment needs TLS at all, so a build that
      # silently stopped emitting a service worker must fail here rather than in
      # production three weeks later.
      - name: Assert the PWA output exists
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/sw.js
          ls apps/web/dist/*.webmanifest >/dev/null

  # A pull request that changes how the image is built should prove the image
  # still builds — but only for amd64 and without pushing, which keeps it a few
  # minutes.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build (amd64, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
